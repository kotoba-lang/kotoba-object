name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clojure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Check out pinned JVM compatibility loader
        uses: actions/checkout@v4
        with:
          repository: kotoba-lang/kotoba
          ref: 4aa12760cea5800109ad65e7ca016b0c010f9302
          path: .test-support/kotoba
      - name: Run existing .cljk tests and reject an empty suite
        shell: bash
        run: |
          set -euo pipefail
          clojure -Sdeps '{:aliases {:cljk-ci {:main-opts ["-i" ".test-support/kotoba/tools/cljk_loader.cljk" "-m" "cognitect.test-runner"]}}}' -M:test:cljk-ci | tee test-output.log
          python3 -c 'import pathlib,re; assert re.search(r"Ran [1-9][0-9]* tests containing [1-9][0-9]* assertions\.", pathlib.Path("test-output.log").read_text()), "No tests executed"'
